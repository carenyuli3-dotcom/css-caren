<!DOCTYPE html>
<html>
<head>
    <title>Ejemplo de Selectores CSS</title>
    <meta charset="UTF-8">

    <style>
        p strong {
            color: #008000;
        }

        h1 strong {
            color: #ff6600;
        }
    </style>
</head>

<body>

    <h1>
        Este es un encabezado principal con una palabra resaltada:
        <strong>Destacada</strong>
    </h1>

    <p>
        En este párrafo usamos la etiqueta strong para mostrar un texto especial:
        <strong>Importante</strong>
    </p>

</body>
</html>
