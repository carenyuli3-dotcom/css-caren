    <title>Uso de CSS Externo</title>
    <meta charset="UTF-8">
    <link rel="StyleSheet" href="estilos.css" type="text/css">
</head>

<body>

    <h1>Introducción a las hojas de estilo externas</h1>

    <p>
        Las hojas de estilo externas permiten separar el diseño de una página web
        del contenido HTML. De esta manera podemos modificar los colores, tamaños
        y estilos desde un solo archivo CSS que puede ser utilizado por varias páginas.
    </p>
