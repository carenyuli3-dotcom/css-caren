<!DOCTYPE html>
<html>
<head>
    <title>Ejemplo de Títulos</title>
    <meta charset="UTF-8">

    <style>
        h1 {
            color: #008000;
            text-align: left;
            text-decoration: underline;
        }

        h2 {
            color: #0066cc;
            text-align: center;
            text-decoration: underline;
        }

        h3 {
            color: #800080;
            text-align: right;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Título principal de la página</h1>
    <h2>Segundo nivel de información</h2>
    <h3>Tercer nivel del contenido</h3>

</body>
</html>
