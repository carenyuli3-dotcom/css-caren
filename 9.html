<!DOCTYPE html>
<html>
<head>
    <title>Ejemplo de Colores CSS</title>
    <meta charset="UTF-8">

    <style>
        body {
            color: #cc0000;
            font-family: Arial;
        }

        em {
            color: #006600;
        }

        p {
            color: #555555;
        }
    </style>
</head>

<body>

    <h1>
        Este es un encabezado con una palabra destacada: 
        <em>Importante</em>
    </h1>

    <p>
        El encabezado aparece de color rojo, excepto la palabra Importante que cambia
        al color verde gracias al elemento em. Este párrafo utiliza un color gris
        diferente para mostrar cómo funcionan los estilos CSS.
    </p>

</body>
</html>
