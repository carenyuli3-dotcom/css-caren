
<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        function mostrarPersona() {
            let nombre = "Carlos";
            let edad = 20;

            document.write("El nombre es: " + nombre);
            document.write("<br>");
            document.write("La edad es: " + edad + " años");
        }

        // Llamada a la función
        mostrarPersona();
    </script>

</body>

</html>
