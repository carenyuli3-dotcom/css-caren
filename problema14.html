
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 14 - Bordes</title>

    <style>
        .producto {
            background-color: #e0f7fa;
            border-width: 3px;
            border-style: solid;
            border-color: blue;
        }

        .oferta {
            background-color: #fff3cd;
            border-width: 2px;
            border-style: dashed;
            border-color: red;
        }
    </style>
</head>
<body>

    <h1>Catálogo de productos</h1>

    <p class="producto">Producto: Audífonos</p>

    <p class="oferta">Oferta: Teclado inalámbrico</p>

</body>
</html>
