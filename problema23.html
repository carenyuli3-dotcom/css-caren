
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 23</title>
    <style>
        .contenedor {
            position: relative;
            height: 180px;
            background-color: #eeeeee;
        }

        .etiqueta {
            position: absolute;
            top: 30px;
            left: 40px;
            background-color: orange;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>Posición de elementos</h1>
    <div class="contenedor">
        <div class="etiqueta">Etiqueta posicionada</div>
    </div>
</body>
</html>
