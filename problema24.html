
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 24</title>
    <style>
        .foto {
            float: left;
            width: 100px;
            height: 100px;
            background-color: lightcoral;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <h1>Texto con elemento flotante</h1>
    <div class="foto"></div>
    <p>
        Este texto aparece al lado de la caja flotante.
        La propiedad float permite que el contenido
        fluya alrededor del elemento.
    </p>
</body>
</html>
