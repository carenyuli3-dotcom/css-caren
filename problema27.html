
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 27</title>
    <style>
        .normal {
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .transparente {
            background-color: red;
            color: white;
            padding: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <h1>Transparencia en CSS</h1>

    <p class="normal">Elemento normal</p>
    <p class="transparente">Elemento transparente</p>
