
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Actividad 38</title>
<style>
.caja {
    position: absolute;
    width: 150px;
    height: 120px;
    padding: 10px;
}
.roja {
    top: 100px; left: 30px;
    background-color: red;
    z-index: 1;
}
.azul {
    top: 130px; left: 80px;
    background-color: blue;
    z-index: 2;
}
.verde {
    top: 160px; left: 130px;
    background-color: green;
    z-index: 3;
}
</style>
</head>
<body>
<h1>Orden de las cajas</h1>
<div class="caja roja">Caja roja</div>
<div class="caja azul">Caja azul</div>
<div class="caja verde">Caja verde</div>
</body>
</html>
