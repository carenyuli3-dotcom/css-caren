
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Actividad 46</title>
<style>
* { box-sizing: border-box; }
header, footer {
    padding: 20px;
    background-color: #30475e;
    color: white;
    text-align: center;
}
main {
    display: flex;
    min-height: 200px;
}
aside, article {
    padding: 15px;
}
.izquierda, .derecha {
    width: 25%;
    background-color: #dbe2ef;
}
.centro {
    width: 50%;
    background-color: #f5f5f5;
}
</style>
</head>
<body>
<header><h1>Mi sitio web</h1></header>
<main>
    <aside class="izquierda">Menú</aside>
    <article class="centro">Contenido principal</article>
    <aside class="derecha">Noticias</aside>
</main>
<footer>Pie de página</footer>
</body>
</html>
