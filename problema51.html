
<!DOCTYPE html>
<html>
<head>
  <title>Selector de atributo</title>
  <style>
    a {
      color: blue;
    }

    a[target="_blank"] {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Mis enlaces</h1>

  <a href="https://www.google.com">Google</a>
  <br><br>
  <a href="https://www.youtube.com" target="_blank">
    YouTube
  </a>
</body>
</html>
