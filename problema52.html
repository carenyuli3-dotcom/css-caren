
<!DOCTYPE html>
<html>
<head>
  <title>Primer y ultimo elemento</title>
  <style>
    li:first-child {
      color: green;
    }

    li:last-child {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Mis frutas favoritas</h1>

  <ul>
    <li>Manzana</li>
    <li>Banano</li>
    <li>Uva</li>
    <li>Fresa</li>
  </ul>
</body>
</html>
