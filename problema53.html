
<!DOCTYPE html>
<html>
<head>
  <title>Filas de colores</title>
  <style>
    li:nth-child(even) {
      background-color: yellow;
    }

    li {
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Lista de estudiantes</h1>

  <ul>
    <li>Juan</li>
    <li>Pedro</li>
    <li>Maria</li>
    <li>Sofia</li>
    <li>Carlos</li>
    <li>Laura</li>
  </ul>
</body>
</html>
