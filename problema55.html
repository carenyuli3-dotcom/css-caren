
<!DOCTYPE html>
<html>
<head>
  <title>Mi texto</title>
  <style>
    p {
      font-size: 18px;
    }

    p:not(.importante) {
      color: green;
    }

    .importante {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Las reglas de mi casa</h1>

  <p>Debo hacer las tareas.</p>
  <p class="importante">Debo respetar a los demas.</p>
  <p>Debo ordenar mi cuarto.</p>
</body>
</html>
