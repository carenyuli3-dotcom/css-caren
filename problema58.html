
<!DOCTYPE html>
<html>
<head>
  <title>Palabras importantes</title>
  <style>
    strong::before {
      content: "¡";
      color: red;
    }

    strong::after {
      content: "!";
      color: red;
    }

    strong {
      color: blue;
    }
  </style>
</head>
<body>
  <h1>Mis mensajes</h1>

  <p>Hoy tengo una noticia <strong>genial</strong>.</p>
  <p>Mañana iremos al <strong>parque</strong>.</p>
  <p>Mi equipo es el <strong>mejor</strong>.</p>
</body>
</html>
