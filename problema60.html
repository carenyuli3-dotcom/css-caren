
<!DOCTYPE html>
<html>
<head>

    .contenedor {

      background-color: lightblue;
      border: 2px solid blue;
      padding: 20px;
      width: 100px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Mis animales favoritos</h1>

  <div class="contenedor">
    <div class="animal">Perro</div>
    <div class="animal">Gato</div>
    <div class="animal">Conejo</div>
    <div class="animal">Panda</div>
  </div>
</body>
</html>
