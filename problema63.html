
<!DOCTYPE html>
<html>
<head>
  <title>Cajas alineadas</title>
  <style>
    .contenedor {
      display: flex;
      align-items: center;
      height: 200px;
      background-color: lightgray;
      gap: 10px;
    }

    .caja {
      background-color: lightgreen;
      padding: 20px;
      border: 2px solid green;
    }
  </style>
</head>
<body>
  <h1>Mis cajas alineadas</h1>

  <div class="contenedor">
    <div class="caja">Caja 1</div>
    <div class="caja">Caja 2</div>
    <div class="caja">Caja 3</div>
  </div>
</body>
</html>
