
<!DOCTYPE html>
<html>
<head>
  <title>Tamaños de cajas</title>
  <style>
    .contenedor {
      display: flex;
      background-color: lightgray;
      gap: 5px;
    }

    .caja {
      background-color: lightblue;
      border: 2px solid blue;
      padding: 15px;
    }

    .caja1 {
      flex-basis: 20%;
    }

    .caja2 {
      flex-basis: 60%;
    }

    .caja3 {
      flex-basis: 20%;
    }
  </style>
</head>
<body>
  <h1>Mis cajas de diferentes tamaños</h1>

  <div class="contenedor">
    <div class="caja caja1">Caja 1</div>
    <div class="caja caja2">Caja 2</div>
    <div class="caja caja3">Caja 3</div>
  </div>
</body>
</html>
