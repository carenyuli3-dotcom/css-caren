
<!DOCTYPE html>
<html>
<head>
  <title>Cajas con flex</title>
  <style>
    .contenedor {
      display: flex;
      gap: 10px;
      background-color: lightgray;
    }

    .caja {
      background-color: orange;
      border: 2px solid black;
      padding: 20px;
    }

    .caja1 {
      flex: 1 1 20%;
    }

    .caja2 {
      flex: 2 1 40%;
    }

    .caja3 {
      flex: 1 1 20%;
    }
  </style>
</head>
<body>
  <h1>Mis cajas flexibles</h1>

  <div class="contenedor">
    <div class="caja caja1">Caja 1</div>
    <div class="caja caja2">Caja 2</div>
    <div class="caja caja3">Caja 3</div>
  </div>
</body>
</html>
